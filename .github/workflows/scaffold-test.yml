name: Scaffold matrix
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - name: minimal
            flags: '--no-blog --no-i18n --no-contact --no-seed --no-ga'
          - name: blog-only
            flags: '--with-blog --no-i18n --no-contact --no-seed --no-ga'
          - name: i18n-only
            flags: '--no-blog --with-i18n --no-contact --no-seed --no-ga'
          - name: full
            flags: '--with-blog --with-i18n --with-contact --with-seed --with-ga'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx setup.ts --name=test-${{ matrix.preset.name }} ${{ matrix.preset.flags }} --skip-install --skip-neon --skip-git
      - run: pnpm install --no-frozen-lockfile
      - name: Stub importMap for typecheck
        run: echo 'export const importMap = {};' > 'src/app/(payload)/importMap.js'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Check setup.ts cleaned up
        run: |
          test ! -f setup.ts
          test ! -f .template.json
          ! grep -rn "@template:" src/ || (echo "markers leaked" && exit 1)
      - name: Build
        env:
          PAYLOAD_ENABLED: 'false'
        run: pnpm build
